<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="dark"><title>Monterto External Viewer</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--panel2:#232833;--line:#343a46;--txt:#eef1f7;--muted:#9ba4b4;--accent:#8ba9ff;--danger:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 12px;min-height:40px}button:active{background:#39445a}input,select{background:#12151b;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;width:100%;min-height:40px}.app{max-width:1100px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:18px;font-weight:750}.sub{font-size:11px;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700}.vars{display:grid;gap:8px}.varrow{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;align-items:center}.varrow b{color:var(--accent);text-align:center}.tokenbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tokenbar button{min-height:34px;padding:6px 10px}.urlrow{display:flex;gap:7px;margin-top:10px}.urlrow button{white-space:nowrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.primary{background:#344b83;border-color:#5874b5}.status{color:var(--muted);font-size:12px;margin-top:8px}.sectiontitle{font-weight:700}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.toolbar select{width:auto;flex:1;min-width:110px}.toolbar button{padding:8px 10px;min-height:36px}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.group{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;min-width:0}.group img{width:100%;aspect-ratio:1.35;object-fit:contain;background:#0b0d11;display:block}.gmeta{padding:9px}.gname{font-weight:700;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:12px}.detailhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.detailhead strong{flex:1}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#151820;min-width:0}.tile img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#090b0f}.tiletext{padding:7px;overflow-wrap:anywhere;font-size:12px}.listview .tile{display:grid;grid-template-columns:84px 1fr}.listview .tile img{height:84px;aspect-ratio:auto}.failed{color:var(--danger);overflow-wrap:anywhere}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000e;z-index:5;display:flex;align-items:center;justify-content:center;padding:12px}.modalbody{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:48px 8px 10px}.modal img{max-width:100%;max-height:calc(100% - 42px);object-fit:contain;transform-origin:center center;touch-action:none}.modalurl{max-width:96%;font-size:10px;color:#aeb7c7;overflow-wrap:anywhere;text-align:center;margin-top:8px;max-height:34px;overflow:auto}.modal button{position:absolute;top:12px;right:12px;z-index:2}.empty{padding:28px 10px;text-align:center;color:var(--muted)}@media(min-width:650px){.app{padding:20px}.groups{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.vars{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main class="app">
<header class="top"><div><div class="brand">Monterto <span class="muted">/ External Viewer</span></div><div class="sub">외부 이미지 뷰어</div></div><button id="toggleConfig">설정 접기</button></header>
<section class="panel" id="config"><div class="panelhead"><span>변수 설정</span><button id="addVar">＋ 변수 추가</button></div><div id="vars" class="vars"></div><div class="tokenbar" id="tokens"></div><div class="urlrow"><input id="template" placeholder="이미지 URL 템플릿 (예: https://.../{A}/{B}.jpg)"><button class="primary" id="generate">목록 생성</button></div><div class="actions"><button id="saveFav">즐겨찾기 저장</button><select id="favorites"><option value="">즐겨찾기 선택</option></select><button id="loadFav">불러오기</button><button id="deleteFav">삭제</button></div><div class="status" id="status"> {A}는 필수 묶음 기준 변수입니다. 범위 예시: 1..10 또는 a..z</div></section>
<section class="panel"><div class="toolbar" id="overviewTools"><span class="sectiontitle" id="resultTitle">이미지 묶음</span><span class="muted" id="count"></span></div><div id="overview" class="groups"><div class="empty">변수와 템플릿 URL을 입력한 뒤 목록을 생성하세요.</div></div>
<div id="detail" class="hidden"><div class="detailhead"><button id="back">← 뒤로</button><strong id="detailTitle"></strong><span class="muted" id="detailCount"></span></div><div class="toolbar"><select id="sort"><option value="original">기본 순서</option><option value="asc">이름 오름차순</option><option value="desc">이름 내림차순</option></select><select id="mode"><option value="grid">아이콘</option><option value="list">목록</option><option value="details">자세히</option></select><button id="smaller">−</button><span id="zoomLabel" class="muted">50%</span><button id="larger">＋</button></div><div id="tiles" class="tiles" style="margin-top:10px"></div></div></section>
<section class="panel"><div class="panelhead"><span>불러오지 못한 이미지</span><button id="clearFailed">목록 지우기</button></div><div id="failed" class="muted">실패한 URL이 여기에 표시됩니다.</div></section>
</main><div id="modal" class="modal hidden"><button id="closeModal">닫기 ✕</button><div class="modalbody"><img id="modalImg"><div id="modalUrl" class="modalurl"></div></div></div>
<script>
(function(){
const $=id=>document.getElementById(id);let vars=[{key:"A",value:"1..5"},{key:"B",value:"1..4"}],groups=[],active=null,zoom=50,failed=[],original=[],modalScale=1,pinchStart=1,pinchDistance=0;
function expand(s){s=(s||"").trim();if(!s)return[];const m=s.match(/^(-?\d+)\.\.(-?\d+)$/);if(m){let a=+m[1],b=+m[2],step=a<=b?1:-1,out=[];for(let n=a;step>0?n<=b:n>=b;n+=step){out.push(String(n));if(out.length>=500)break}return out}const c=s.match(/^([a-zA-Z])\.\.([a-zA-Z])$/);if(c){let a=c[1].charCodeAt(0),b=c[2].charCodeAt(0),step=a<=b?1:-1,out=[];for(let n=a;step>0?n<=b:n>=b;n+=step){out.push(String.fromCharCode(n));if(out.length>=500)break}return out}return s.split(",").map(x=>x.trim()).filter(Boolean).slice(0,500)}
function renderVars(){ $("vars").innerHTML="";vars.forEach((v,i)=>{let row=document.createElement("div");row.className="varrow";let b=document.createElement("b");b.textContent="{"+v.key+"}";let input=document.createElement("input");input.value=v.value;input.placeholder="쉼표 구분 또는 범위 (1..10)";input.addEventListener("input",()=>v.value=input.value);let del=document.createElement("button");del.textContent="×";del.disabled=v.key==="A";del.onclick=()=>{vars.splice(i,1);renderVars()};row.append(b,input,del);$("vars").append(row)});$("tokens").innerHTML="";vars.forEach(v=>{let b=document.createElement("button");b.textContent="{"+v.key+"} 삽입";b.onclick=()=>{let t=$("template"),start=t.selectionStart,end=t.selectionEnd,s=t.value,token="{"+v.key+"}";t.value=s.slice(0,start)+token+s.slice(end);t.focus();t.setSelectionRange(start+token.length,start+token.length)};$("tokens").append(b)})}
function setStatus(s){$("status").textContent=s}
$("addVar").onclick=()=>{let used=vars.map(v=>v.key),key="";for(let c=66;c<=90;c++){let k=String.fromCharCode(c);if(!used.includes(k)){key=k;break}}if(!key){setStatus("변수는 A부터 Z까지 사용할 수 있습니다.");return}vars.push({key,value:""});renderVars()};
$("generate").onclick=()=>{let template=$("template").value.trim();if(!template){setStatus("템플릿 URL을 입력해 주세요.");return}if(!template.includes("{A}")){setStatus("{A}를 템플릿 URL에 반드시 넣어 주세요.");return}let av=expand((vars.find(v=>v.key==="A")||{}).value);if(!av.length){setStatus("{A} 묶음 값을 입력해 주세요.");return}let others=vars.filter(v=>v.key!=="A"&&template.includes("{"+v.key+"}"));if(others.some(v=>!v.value.trim())){setStatus("URL에서 사용하는 나머지 변수의 값도 입력해 주세요.");return}let combos=[{}];for(let v of others){let values=expand(v.value);if(!values.length){setStatus("{"+v.key+"} 값이 비어 있습니다.");return}let next=[];for(let map of combos){for(let value of values){next.push(Object.assign({},map,{[v.key]:value}));if(next.length>=500)break}if(next.length>=500)break}combos=next}groups=av.map(value=>({value,urls:combos.map(map=>template.replace(/\{([A-Z])\}/g,(_,k)=>encodeURIComponent(k==="A"?value:(map[k]||"{"+k+"}"))).replace(/(raw\.githubusercontent\.com\/[^/]+\/[^/]+\/)refs\/heads\//,"$1"))}));active=null;failed=[];render();setStatus("총 "+groups.length+"개 묶음을 생성했습니다.")};
function render(){ $("detail").classList.add("hidden");$("overview").classList.remove("hidden");$("overviewTools").classList.remove("hidden");$("overview").innerHTML="";$("count").textContent=groups.length?groups.length+"개 묶음":"";if(!groups.length){$("overview").innerHTML='<div class="empty">생성된 이미지 묶음이 없습니다.</div>';return}groups.forEach((g,i)=>{let card=document.createElement("div");card.className="group";let img=document.createElement("img");img.loading="lazy";img.src=g.urls[0]||"";img.onerror=()=>{img.style.opacity=".2"};let meta=document.createElement("div");meta.className="gmeta";let name=document.createElement("div");name.className="gname";name.textContent=g.value;let count=document.createElement("div");count.className="muted";count.textContent=g.urls.length+"개 이미지";meta.append(name,count);card.append(img,meta);card.onclick=()=>openGroup(i);$("overview").append(card)})}
function openGroup(i){active=i;let g=groups[i];$("overview").classList.add("hidden");$("overviewTools").classList.add("hidden");$("detail").classList.remove("hidden");$("detailTitle").textContent=g.value;$("detailCount").textContent=g.urls.length+"개";renderTiles()}
function renderTiles(){let g=groups[active];if(!g)return;let urls=g.urls.map((u,i)=>({u,i}));let sort=$("sort").value;if(sort!=="original")urls.sort((a,b)=>sort==="asc"?a.u.localeCompare(b.u):b.u.localeCompare(a.u));let box=$("tiles");box.innerHTML="";box.className="tiles"+($("mode").value==="list"?" listview":"");box.style.gridTemplateColumns=($("mode").value==="details"||$("mode").value==="list")?"1fr":"repeat("+Math.max(1,Math.min(10,Math.round(11-zoom/10)))+",minmax(0,1fr))";urls.forEach(item=>{let tile=document.createElement("div");tile.className="tile";let img=document.createElement("img");img.loading="lazy";img.src=item.u;img.onclick=()=>showModal(item.u);img.onerror=()=>{if(!failed.includes(item.u)){failed.push(item.u);renderFailed()}};let txt=document.createElement("div");txt.className="tiletext";txt.textContent=(item.i+1)+". 이미지";tile.append(img,txt);box.append(tile)})}
function showModal(url){$("modalImg").src=url;$("modalUrl").textContent=url;modalScale=1;$("modalImg").style.transform="scale(1)";$("modal").classList.remove("hidden")}function renderFailed(){$("failed").innerHTML="";if(!failed.length){$("failed").textContent="실패한 URL이 없습니다.";return}failed.forEach(u=>{let d=document.createElement("div");d.className="failed";d.textContent=u;$("failed").append(d)})}
$("back").onclick=()=>{active=null;render()};$("mode").onchange=renderTiles;$("sort").onchange=renderTiles;$("smaller").onclick=()=>{zoom=Math.max(10,zoom-10);$("zoomLabel").textContent=zoom+"%";renderTiles()};$("larger").onclick=()=>{zoom=Math.min(100,zoom+10);$("zoomLabel").textContent=zoom+"%";renderTiles()};$("zoomLabel").textContent=zoom+"%";$("closeModal").onclick=()=>$("modal").classList.add("hidden");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.add("hidden")};
const modalImg=$("modalImg");function touchDistance(t){let dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy)}modalImg.addEventListener("touchstart",e=>{if(e.touches.length===2){pinchDistance=touchDistance(e.touches);pinchStart=modalScale;e.preventDefault()}},{passive:false});modalImg.addEventListener("touchmove",e=>{if(e.touches.length===2&&pinchDistance>0){modalScale=Math.max(1,Math.min(6,pinchStart*touchDistance(e.touches)/pinchDistance));modalImg.style.transform="scale("+modalScale+")";e.preventDefault()}},{passive:false});modalImg.addEventListener("touchend",e=>{if(e.touches.length<2)pinchDistance=0});$("clearFailed").onclick=()=>{failed=[];renderFailed()};
function loadFavs(){let data=[];try{data=JSON.parse(localStorage.getItem("montertoExternalFavorites")||"[]")}catch(e){}$("favorites").innerHTML='<option value="">즐겨찾기 선택</option>';data.forEach((f,i)=>{let o=document.createElement("option");o.value=i;o.textContent=f.name;$("favorites").append(o)})}
$("saveFav").onclick=()=>{let name=prompt("즐겨찾기 이름");if(!name)return;let data=[];try{data=JSON.parse(localStorage.getItem("montertoExternalFavorites")||"[]")}catch(e){}data.push({name:name,vars:vars,template:$("template").value});localStorage.setItem("montertoExternalFavorites",JSON.stringify(data));loadFavs();setStatus("즐겨찾기를 저장했습니다.")};
$("loadFav").onclick=()=>{let i=$("favorites").value;if(i==="")return;let data=JSON.parse(localStorage.getItem("montertoExternalFavorites")||"[]"),f=data[+i];if(!f)return;vars=f.vars; $("template").value=f.template;renderVars();setStatus("즐겨찾기를 불러왔습니다.")};
$("deleteFav").onclick=()=>{let i=$("favorites").value;if(i==="")return;let data=JSON.parse(localStorage.getItem("montertoExternalFavorites")||"[]");data.splice(+i,1);localStorage.setItem("montertoExternalFavorites",JSON.stringify(data));loadFavs();setStatus("즐겨찾기를 삭제했습니다.")};
$("toggleConfig").onclick=()=>{let hidden=$("config").classList.toggle("hidden");$("toggleConfig").textContent=hidden?"설정 펼치기":"설정 접기"};
renderVars();loadFavs();renderFailed();
})();
</script></body></html>
